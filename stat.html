<div class="layout">
    <div class="layout-col">
        <div class="line">
            <div class="group">
                <div class="items">
                    <div class="item">N</div>
                </div>
            </div>
        </div>

        <div class="strategies">
            <div class="strategy strategy-repeats">
                <div class="group">
                    <div class="items">
                        <div class="item">N</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="layout-col">
        <div class="result">
            <div class="group">
                <div class="items">
                    <div class="item">N</div>
                </div>
            </div>
        </div>
    </div>

    <div class="layout-col">
        <div class="strategy strategy-last-numbers">
            <div class="custom_numbers">
                <input type="text" placeholder="Numbers">
            </div>

            <div class="custom_mode">
                <input type="text" placeholder="Mode(1,2,3,4)">
            </div>

            <div class="custom_offset">
                <div class="control-group">
                    <input type="text" placeholder="Offset[,steps[,limit]]">
                    <span class="inline-control" id="offset_plus">+</span>
                    <span class="inline-control" id="offset_minus">-</span>
                </div>
            </div>

            <div class="custom_skip">
                <input type="text" placeholder="Skip rounds">
            </div>

            <div class="mix-area">
                <div class="custom_save_mix">
                    <button>Save</button>
                </div>
                <div class="custom_mix"></div>
                <div class="custom_toggle_mix mix-control">
                    <button>Start mix</button>
                </div>
            </div>

            <div class="group">
                <div class="items">
                    <div class="item">N</div>
                </div>
            </div>
        </div>
    </div>

    <div class="layout-col vertical">
        <div class="strategies">
            <div class="strategy numbers-position">
                <div class="group">
                    <div class="items">
                        <div class="item blue">N</div>
                    </div>
                </div>
            </div>

            <div class="strategy spins-count">
                <div class="group">
                    <div class="items">
                        <div class="item neutral">N</div>
                    </div>
                </div>
            </div>

            <div class="strategy game-rounds-count">
                <div class="group">
                    <div class="items">
                        <div class="item green">N</div>
                    </div>
                </div>
            </div>

            <div class="start-game control-button green">
                <span>➟</span>
            </div>

            <div class="rollback control-button neutral">
                <span><=</span>
            </div>
        </div>

        <div class="table">

            <div class="rows">
